name: Deploy to VDSKA

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/pitch-wow-mini
            git config --global --add safe.directory /opt/pitch-wow-mini
            git checkout master
            git pull origin master
            cd infra
            docker compose up -d --build
            docker compose exec -T -w /app/migrations bot alembic -c /app/migrations/alembic.ini upgrade head

      - name: Notify admin via Telegram
        if: success()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          MSG="<b>Deploy success</b>%0A%0ARepo: <code>pitch-wow-mini</code>%0ACommit: <code>${SHORT_SHA}</code>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ROOT_ADMIN_TG_ID }}" \
            -d parse_mode="HTML" \
            -d text="${MSG}"
