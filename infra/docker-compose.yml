name: pitch-wow-mini

services:
  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    env_file: ../.env
    ports:
      - "127.0.0.1:${BOT_HOST_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "apps.bot.app.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    env_file: ../.env
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: ai-assistant-template_postgres_data
