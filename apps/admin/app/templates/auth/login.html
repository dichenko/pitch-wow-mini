<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-box h1 { margin-bottom: 16px; font-size: 22px; }
        .login-box p { margin-bottom: 24px; color: #666; font-size: 14px; }
        .login-box button {
            background: #007aff;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover { background: #0056cc; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Admin Panel</h1>
        <p>Click the button below to log in.</p>
        <form method="POST" action="/admin/login">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
